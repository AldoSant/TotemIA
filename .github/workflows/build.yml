name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Configure Totem API key
      run: |
        if [ -n "$TOTEM_API_KEY" ]; then
          printf 'TOTEM_API_KEY=%s\n' "$TOTEM_API_KEY" >> local.properties
          echo "TOTEM_API_KEY configured for this build."
        else
          echo "TOTEM_API_KEY is required for AI mentor chat builds. Configure the GitHub secret before publishing APKs."
          exit 1
        fi
      env:
        TOTEM_API_KEY: ${{ secrets.TOTEM_API_KEY || vars.TOTEM_API_KEY }}

    - name: Build Debug APK
      run: ./gradlew clean assembleDebug --no-daemon --stacktrace
      env:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"

    - name: Prepare APK artifact
      if: success()
      run: |
        mkdir -p artifacts
        cp app/build/outputs/apk/debug/app-debug.apk artifacts/TotemIA-v1.0.4-debug.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: TotemIA-v1.0.4-debug-apk
        path: artifacts/TotemIA-v1.0.4-debug.apk
        retention-days: 90
