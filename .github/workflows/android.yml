name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Configure Totem API key
      run: |
        if [ -n "$TOTEM_API_KEY" ]; then
          printf 'TOTEM_API_KEY=%s\n' "$TOTEM_API_KEY" >> local.properties
        else
          echo "TOTEM_API_KEY not configured; APK will use bundled journey fallback for the home screen."
        fi
      env:
        TOTEM_API_KEY: ${{ secrets.TOTEM_API_KEY || vars.TOTEM_API_KEY }}

    - name: Build with Gradle
      run: ./gradlew build

    - name: Run unit tests
      run: ./gradlew test
